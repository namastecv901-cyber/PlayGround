<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎯 بامب ودامب | PUMP & DUMP</title>
<style>
:root{--bg:#070a14;--card:#11172e;--line:#ffffff14;--txt:#eef1ff;--mut:#9aa3c7;--up:#16c784;--down:#ea3943;--gold:#f0b90b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(900px 400px at 50% -10%,#f0b90b22,transparent),var(--bg);color:var(--txt);min-height:100vh}
.container{max-width:1100px;margin:auto;padding:16px}
header{text-align:center;padding:20px 0 8px}
header h1{font-size:1.7rem}header h1 span{color:var(--gold)}
header p{color:var(--mut);font-size:.88rem;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0}
.btn{background:linear-gradient(135deg,#f6d32a,#f0b90b);border:none;color:#111;border-radius:10px;padding:10px 22px;font-weight:900;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);text-decoration:none;display:inline-block}
#pdStatus{text-align:center;color:var(--mut);font-size:.86rem}
h2.sec{margin:18px 0 8px;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{background:linear-gradient(180deg,#131b36,#0b1124);border-radius:16px;padding:14px}
.card.pump{border:2px solid #16c78466;box-shadow:0 0 24px #16c78415}
.card.dump{border:2px solid #ea394366;box-shadow:0 0 24px #ea394315}
.card .top{display:flex;align-items:center;gap:8px}
.card .top b{font-size:1.15rem}
.badge{margin-inline-start:auto;border-radius:99px;padding:4px 12px;font-size:.75rem;font-weight:900}
.badge.win{background:#16c78422;border:1px solid #16c78466;color:var(--up)}
.badge.loss{background:#ea394322;border:1px solid #ea394366;color:var(--down)}
.pn{text-align:center;font-size:1.9rem;font-weight:900;margin:4px 0}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:.8rem}
.boxes div{background:#00000055;border-radius:8px;padding:6px 8px}
.boxes small{color:var(--mut);display:block;font-size:.68rem}
canvas.spark{width:100%;height:56px;display:block;margin-top:6px}
.warn{margin-top:8px;font-size:.78rem;font-weight:800;color:var(--gold);background:#f0b90b14;border:1px solid #f0b90b33;border-radius:8px;padding:6px;text-align:center}
footer{text-align:center;color:var(--mut);font-size:.78rem;padding:16px}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--mut)}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header><h1>🎯 بامب <span>&</span> دامب</h1>
<p>قسم مخصص: أقوى الصعود اليوم 🟢 والانهيارات 🔴 — بصور وشارت لكل بطاقة</p></header>
<div class="row">
<button class="btn" id="pdBtn">🔄 فحص الآن</button>
<label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.85rem"><input id="pdAuto" type="checkbox" checked> 🔁 تلقائي وحده كل 5 د</label>
<span class="muted" id="pdNext" style="font-size:.76rem"></span>
<a class="btn ghost" href="hq.html">🏆 قسم HQ</a>
<a class="btn ghost" href="index.html">💎 التطبيق</a>
</div>
<div id="pdStatus">اضغط «🔄 فحص الآن» — يجلب أعلى السيولة المتحركة من Binance.</div>
<h2 class="sec">🟢 بامب اليوم <small class="muted" id="pCount"></small></h2>
<div class="grid" id="pumpGrid"></div>
<h2 class="sec">🔴 دامب اليوم — احذر الساقط <small class="muted" id="dCount"></small></h2>
<div class="grid" id="dumpGrid"></div>
<footer>Spot فقط • البامب مخاطرة عالية — ادخل بحصة صغيرة ووقف إلزامي • الدامب للمراقبة لا للشراء</footer>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const money=n=>{ if(n==null||isNaN(n)) return '—'; return '$ '+Number(n).toLocaleString('en-US',{maximumFractionDigits:4}); };
const STAB=new Set(['USDT','USDC','DAI','FDUSD','USDE','TUSD','USDD','PYUSD','EURS']);
async function jget(url){
  const ctl=new AbortController(),to=setTimeout(()=>{try{ctl.abort();}catch(e){}},15000);
  try{ const r=await fetch(url,{signal:ctl.signal,cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); return await r.json(); }
  finally{ clearTimeout(to); }
}
async function klines(sym){
  const q='symbol='+sym+'&interval=1h&limit=60';
  try{ const k=await jget('https://data-api.binance.vision/api/v3/klines?'+q); return (k&&k.length>=10)?k:null; }catch(e){ return null; }
}
function drawSpark(cv,pr,lv){
  try{
    if(!cv||!pr||pr.length<2) return;
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
    let mn=Math.min.apply(null,pr),mx=Math.max.apply(null,pr);
    (lv?Object.values(lv):[]).forEach(v=>{ if(isFinite(v)){ if(v<mn)mn=v; if(v>mx)mx=v; } });
    const sp=(mx-mn)||1, Y=v=>Math.max(2,Math.min(H-2,H-4-((v-mn)/sp)*(H-10)));
    const up=pr[pr.length-1]>=pr[0],col=up?'#16c784':'#ea3943';
    ctx.clearRect(0,0,W,H); ctx.beginPath();
    pr.forEach((v,i)=>{ const x=i/(pr.length-1)*W,y=Y(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.stroke();
    const ly=Y(pr[pr.length-1]);
    ctx.beginPath(); ctx.arc(W-5,ly,3,0,7); ctx.fillStyle=col; ctx.fill();
    if(lv){ ctx.setLineDash([4,3]); ctx.lineWidth=1.2;
      const line=(v,c)=>{ if(!isFinite(v)) return; ctx.strokeStyle=c; ctx.beginPath(); ctx.moveTo(0,Y(v)); ctx.lineTo(W,Y(v)); ctx.stroke(); };
      line(lv.tp,'#16c784'); line(lv.entry,'#f0b90b'); line(lv.sl,'#ea3943'); ctx.setLineDash([]); }
  }catch(e){}
}
const PX={};
async function run(){
  const btn=$('pdBtn'),st=$('pdStatus');
  btn.disabled=true;
  try{
    st.textContent='📡 يجلب بيانات السوق...';
    let all=null;
    all=await jget('https://data-api.binance.vision/api/v3/ticker/24hr');
    const pool=all.filter(t=>t.symbol&&t.symbol.endsWith('USDT')&&!/(UP|DOWN|BULL|BEAR)USDT$/.test(t.symbol)&&!STAB.has(t.symbol.slice(0,-4))&&parseFloat(t.quoteVolume||0)>=20000000);
    const pumps=pool.filter(t=>{ const c=parseFloat(t.priceChangePercent||0); return c>=8&&c<=50; }).sort((a,b)=>parseFloat(b.priceChangePercent)-parseFloat(a.priceChangePercent)).slice(0,9);
    const dumps=pool.filter(t=>{ const c=parseFloat(t.priceChangePercent||0); return c<=-8&&c>=-40; }).sort((a,b)=>parseFloat(a.priceChangePercent)-parseFloat(b.priceChangePercent)).slice(0,9);
    $('pCount').textContent='(' + pumps.length + ')'; $('dCount').textContent='(' + dumps.length + ')';
    st.textContent='📈 يرسم الشارتات...';
    async function card(t,isPump){
      const sym=t.symbol, base=sym.replace(/USDT$/,''), price=parseFloat(t.lastPrice), chg=parseFloat(t.priceChangePercent);
      const kl=await klines(sym);
      const pr=kl?kl.slice(-60).map(k=>parseFloat(k[4])):null;
      if(pr) PX[sym]=pr;
      const entry=price, tp=isPump?price*1.08:price*0.94, sl=isPump?price*0.95:price*1.04;
      return '<div class="card '+(isPump?'pump':'dump')+'"><div class="top"><b>'+(isPump?'🟢 ':'🔴 ')+base+'</b><span class="badge '+(chg>=0?'win':'loss')+'">'+(chg>=0?'+':'')+chg.toFixed(2)+'%</span></div>'
      +'<div class="muted" style="font-size:.74rem">'+sym+' • سيولة $'+(parseFloat(t.quoteVolume)/1e6).toFixed(1)+'M</div>'
      +'<div class="pn '+(chg>=0?'up':'down')+'">'+(chg>=0?'+':'')+chg.toFixed(2)+'%</div>'
      +'<div class="boxes"><div><small>📍 '+(isPump?'الدخول':'السعر')+'</small><b>'+money(entry)+'</b></div><div><small>'+(isPump?'🎯 هدف +8%':'📉 قاع 24h')+'</small><b>'+(isPump?money(tp):money(parseFloat(t.lowPrice)))+'</b></div>'
      +'<div><small>🛡 '+(isPump?'وقف -5%':'مقاومة')+'</small><b>'+(isPump?money(sl):money(parseFloat(t.highPrice)))+'</b></div><div><small>⚖️ الحكم</small><b>'+(isPump?'حصة صغيرة':'⛔ مراقبة')+'</b></div></div>'
      +'<canvas class="spark" width="260" height="56" data-sym="'+sym+'" data-e="'+entry+'" data-t="'+tp+'" data-s="'+sl+'"></canvas>'
      +(isPump?'<div class="warn">⚡ بامب نشط — ادخل بحصة صغيرة ووقف إلزامي، لا تطارد +50%</div>':'<div class="warn">⛔ ساقط — لا تشترِ السكين، انتظر انعكاساً مؤكداً بشمعة + حجم</div>')+'</div>';
    }
    async function fill(list,gridId,isPump){
      const g=$(gridId);
      if(!list.length){ g.innerHTML='<div class="panel muted">لا يوجد '+(isPump?'بامب':'دامب')+' مؤهل الآن (سيولة $20M+)</div>'; return; }
      g.innerHTML='';
      let n=0;
      for(const t of list){
        try{ g.insertAdjacentHTML('beforeend', await card(t,isPump)); }catch(e){}
        n++;
        const cv=g.querySelector('canvas[data-sym="'+t.symbol+'"]');
        if(cv) drawSpark(cv,PX[t.symbol],{entry:+cv.dataset.e,tp:+cv.dataset.t,sl:+cv.dataset.s});
        st.textContent='📈 يرسم '+(isPump?'البامب':'الدامب')+'... ('+n+'/'+list.length+')';
      }
    }
    await fill(pumps,'pumpGrid',true);
    await fill(dumps,'dumpGrid',false);
    st.textContent='✅ تم: 🟢 '+pumps.length+' بامب • 🔴 '+dumps.length+' دامب • '+new Date().toLocaleTimeString('ar');
  }catch(e){ $('pdStatus').textContent='⚠️ تعذر الجلب — تحقق من الإنترنت وحدث'; }
  btn.disabled=false;
}
$('pdBtn').onclick=run;
(function(){
  // 🔁 يعمل وحده: فحص تلقائي كل 5 دقائق + فحص فوري عند الفتح — لا يعتمد على أي قسم آخر
  const auto=$('pdAuto'), next=$('pdNext');
  let busy=false, nextAt=Date.now();
  setInterval(()=>{
    if(!auto.checked){ if(next) next.textContent=''; return; }
    if(busy||document.hidden||Date.now()<nextAt){
      if(next&&auto.checked) next.textContent='⏳ بعد '+Math.max(0,Math.round((nextAt-Date.now())/1000))+' ث';
      return;
    }
    busy=true; run().finally(()=>{ busy=false; nextAt=Date.now()+5*60*1000; });
  },5000);
})();
run();
})();
</script>
</body>
</html>
